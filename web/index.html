<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-store">
<title>NK Chaudhary</title>
<style>
  :root {
    --bg:#0d0f12; --panel:#15181d; --line:#262b33; --text:#ecebe8; --muted:#8d949e;
    --cyan:#3fc6ff; --blue:#2b7bff; --pink:#ff5ea8; --me:#1f2630; --warn:#ffb86b;
  }
  * { box-sizing:border-box; }
  html, body { height:100%; }
  body { margin:0; background:var(--bg); color:var(--text);
         font:15px/1.55 "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
         display:flex; flex-direction:column; overflow:hidden; }
  [hidden] { display:none !important; }

  /* ---------- top bar ---------- */
  .top { display:flex; align-items:center; gap:10px; padding:12px 18px; font-size:13px; color:var(--muted); flex:none; }
  .top b { color:var(--text); font-weight:600; }
  .top .sp { flex:1; }
  .histbtn { display:inline-flex; align-items:center; gap:7px; color:var(--text); text-decoration:none; font-size:13.5px; font-weight:600;
             border:1px solid var(--line); background:var(--panel); border-radius:999px; padding:6px 14px; }
  .histbtn:hover { border-color:#3a4250; background:#1b1f26; }
  .histbtn svg { width:16px; height:16px; }

  /* ---------- stage: orb + waveform ---------- */
  .stage { position:relative; height:min(42vh, 400px); min-height:250px; flex:none; }
  #wave { position:absolute; inset:0; width:100%; height:100%; }
  .orb { position:absolute; left:50%; top:50%; width:min(240px, 50vw); aspect-ratio:1; transform:translate(-50%,-50%);
         background:#fff; border-radius:50%; border:0; cursor:pointer; padding:0;
         display:flex; align-items:center; justify-content:center; color:#111;
         box-shadow:0 0 0 1px rgba(255,255,255,.08), 0 0 60px rgba(63,198,255,.12); }
  .orb .mark { display:flex; flex-direction:column; align-items:flex-start; text-align:left; transform:translateX(-4%); }
  .orb .w1 { font-size:clamp(42px, 10vw, 66px); font-weight:800; letter-spacing:-1px; line-height:.95; }
  .orb .w2 { font-size:clamp(20px, 4.8vw, 31px); font-weight:500; letter-spacing:-.3px; line-height:1.1; }
  .orb:focus-visible { outline:3px solid var(--cyan); outline-offset:6px; }
  .state { position:absolute; left:0; right:0; bottom:4px; text-align:center; font-size:13px; color:var(--muted); }
  .state .dot { display:inline-block; width:7px; height:7px; border-radius:50%; background:var(--muted); margin-right:6px; vertical-align:1px; }
  .state.speaking .dot { background:var(--cyan); box-shadow:0 0 8px var(--cyan); }
  .state.thinking .dot { background:var(--warn); animation:blink 1s infinite; }
  .state.listening .dot { background:var(--pink); box-shadow:0 0 8px var(--pink); animation:blink 1.4s infinite; }
  @keyframes blink { 50% { opacity:.3 } }

  /* ---------- controls ---------- */
  .controls { display:flex; flex-direction:column; align-items:center; gap:10px; padding:6px 16px 8px; flex:none; }
  .talk { display:inline-flex; align-items:center; gap:10px; background:#fff; color:#111; border:0; border-radius:999px;
          padding:12px 26px; font:inherit; font-size:16px; font-weight:700; cursor:pointer;
          box-shadow:0 0 30px rgba(63,198,255,.18); }
  .talk svg { width:20px; height:20px; }
  .talk.on { background:var(--pink); color:#fff; box-shadow:0 0 30px rgba(255,94,168,.35); }
  .live { min-height:1.5em; max-width:760px; text-align:center; font-size:16px; color:#ffd1e6; }
  .live:empty { display:none; }
  .row { display:flex; flex-wrap:wrap; justify-content:center; align-items:center; gap:10px; }
  .seg { display:inline-flex; background:var(--panel); border:1px solid var(--line); border-radius:999px; padding:3px; }
  .seg button { background:none; border:0; color:var(--muted); font:inherit; font-size:13px; padding:6px 14px; border-radius:999px; cursor:pointer; white-space:nowrap; }
  .seg button[aria-pressed="true"] { background:#fff; color:#111; font-weight:600; }
  .seg button .bad { color:var(--warn); margin-left:4px; }
  select { background:var(--panel); color:var(--text); border:1px solid var(--line); border-radius:8px; padding:5px 8px; font:inherit; font-size:13px; max-width:240px; }
  label.small { font-size:12.5px; color:var(--muted); display:inline-flex; gap:6px; align-items:center; }
  .notice { text-align:center; font-size:12.5px; color:var(--warn); min-height:1.2em; max-width:760px; }

  /* voice-only vs text-only controls */
  body[data-mode="off"] .voice-only { display:none !important; }
  body:not([data-mode="off"]) .text-only { display:none !important; }

  /* ---------- transcript ---------- */
  #log { flex:1; overflow-y:auto; padding:4px 16px 16px; }
  .inner { max-width:760px; margin:0 auto; display:flex; flex-direction:column; gap:10px; }
  .msg { padding:9px 13px; border-radius:12px; max-width:86%; white-space:pre-wrap; }
  .me { align-self:flex-end; background:var(--me); }
  .nk { align-self:flex-start; background:var(--panel); border:1px solid var(--line); }
  .nk .who { display:block; font-size:11px; letter-spacing:.6px; color:var(--cyan); font-weight:600; margin-bottom:2px; }
  .nk .via { font-size:11px; color:var(--muted); margin-top:4px; display:block; }
  .err { align-self:center; color:#ff9b8f; font-size:13px; }
  .hint { color:var(--muted); text-align:center; font-size:14px; padding:8px; }

  /* ---------- typed input (Text only mode) ---------- */
  form { flex:none; padding:8px 16px 16px; }
  .bar { max-width:760px; margin:0 auto; display:flex; gap:8px; }
  textarea { flex:1; resize:none; height:46px; background:var(--panel); color:var(--text); border:1px solid var(--line);
             border-radius:12px; padding:11px 13px; font:inherit; overflow:hidden; }
  textarea:focus { outline:none; border-color:#3a4250; }
  .send { background:#fff; color:#111; border:0; border-radius:12px; padding:0 18px; font-weight:600; cursor:pointer; }
  @media (max-width:560px) { .stage { height:34vh; }
    .seg button { padding:6px 10px; font-size:12.5px; } }
</style>
</head>
<body data-mode="nk">

<div class="top">
  <b>NK Chaudhary</b><span>· AI recreation</span>
  <span class="sp"></span>
  <a class="histbtn" href="/history" title="See past conversations">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l3 2"/></svg>
    History
  </a>
</div>

<div class="stage">
  <canvas id="wave"></canvas>
  <button class="orb" id="orb" title="Tap to interrupt" aria-label="NK Chaudhary. Tap to interrupt.">
    <span class="mark"><span class="w1">NK</span><span class="w2">Chaudhary</span></span>
  </button>
  <div class="state" id="state"><span class="dot"></span><span id="stateText">Ready</span></div>
</div>

<div class="controls">
  <button class="talk voice-only" id="talk" type="button">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
    <span id="talkLabel">Start conversation</span>
  </button>
  <div class="live voice-only" id="live" aria-live="polite"></div>
  <div class="row">
    <div class="seg" role="group" aria-label="Voice">
      <button data-v="nk" aria-pressed="true">NK Chaudhary voice<span class="bad" id="nkBad" hidden>●</span></button>
      <button data-v="machine" aria-pressed="false">Machine voice</button>
      <button data-v="off" aria-pressed="false">Text only</button>
    </div>
    <select id="machineVoice" title="Machine voice" hidden></select>
    <label class="small voice-only">Listen in
      <select id="listenLang">
        <option value="en-IN">English (India)</option>
        <option value="hi-IN">हिन्दी</option>
      </select>
    </label>
    <label class="small voice-only">Pace
      <select id="pace">
        <option value="0.8">Slow</option>
        <option value="0.88">Calm</option>
        <option value="1">Normal</option>
      </select>
    </label>
    <label class="small voice-only" title="Low ignores sound from your own speakers; use High with headphones">Mic sensitivity
      <select id="sens">
        <option value="low">Low (speakers)</option>
        <option value="medium">Medium</option>
        <option value="high">High (headphones)</option>
      </select>
    </label>
    <label class="small voice-only">Reply after
      <select id="pause">
        <option value="650">a short pause</option>
        <option value="950">a natural pause</option>
        <option value="1500">a long pause</option>
      </select>
    </label>
  </div>
  <div class="notice" id="notice"></div>
</div>

<div id="log"><div class="inner" id="inner">
  <div class="hint voice-only" id="hint">Press <b>Start conversation</b> and just talk. He replies when you pause, and stops if you talk over him.</div>
</div></div>

<form id="f" class="text-only"><div class="bar">
  <textarea id="q" placeholder="Type a question for NK Chaudhary…"></textarea>
  <button class="send" id="send">Send</button>
</div></form>

<script>
const UI_VERSION = 'v11-smooth';
let conversationId = null;          // one saved conversation per 'Start conversation' (or per page visit when typing)
const $ = id => document.getElementById(id);
const store = { get(k, d) { try { return localStorage.getItem(k) ?? d; } catch { return d; } },
                set(k, v) { try { localStorage.setItem(k, v); } catch {} } };

/* =========================================================
   State
   ========================================================= */
let history = [], lastAnswer = '';
let voiceMode = 'nk';                         // 'nk' | 'machine' | 'off'
let nkAvailable = false, nkReason = 'checking…', nkDownThisTurn = false;
let speaking = false, thinking = false, level = 0, synthPulse = 0, userLevel = 0;
let turnId = 0;                               // bumps on every interrupt / new question
let echoRef = '', lastSpokeAt = 0;            // what he said, so the mic ignores his own voice

const INTRO = "Namaste! I'm an AI recreation of Nand Kishore Chaudhary, made from his own words. What would you like to talk about?";
const FILLERS = ['Hmm.', 'Achha.', 'Hmm, achha.'];

function notice(t) { $('notice').textContent = t || ''; }

/* =========================================================
   Status
   ========================================================= */
async function refreshStatus(recheck = false) {
  try {
    const sr = await fetch('/api/status' + (recheck ? '?recheck=1' : ''), { cache: 'no-store' });
    if (sr.status === 401) { location.href = '/login'; return false; }
    const s = await sr.json();
    console.info('NKC', UI_VERSION, s.model, s.knowledge_sections + ' sections', 'serving from ' + s.app_dir);
    const nk = s.voices?.nk || { available: s.voice, reason: '' };
    nkAvailable = !!nk.available; nkReason = nk.reason || '';
  } catch { nkAvailable = false; nkReason = 'server not reachable'; }
  $('nkBad').hidden = nkAvailable;
  document.querySelector('[data-v="nk"]').title = nkAvailable ? 'Cloned voice via ElevenLabs'
    : 'Unavailable: ' + nkReason + ' (falls back to machine voice)';
  if (voiceMode === 'nk' && !nkAvailable) notice(`NK voice unavailable (${nkReason}). Using machine voice.`);
  if (voiceMode === 'nk' && nkAvailable && convo) prefetchFillers();
  return nkAvailable;
}

/* =========================================================
   Mode: NK voice / Machine voice / Text only
   ========================================================= */
function setMode(mode, { speakNow = true } = {}) {
  const wasVoice = voiceMode !== 'off';
  voiceMode = mode;
  document.body.dataset.mode = mode;
  document.querySelectorAll('.seg button').forEach(x => x.setAttribute('aria-pressed', x.dataset.v === mode));
  $('machineVoice').hidden = mode !== 'machine';
  store.set('nk.voiceMode', mode);
  interrupt(); notice('');
  if (mode === 'off') { if (convo) stopConvo(); setTimeout(() => $('q').focus(), 0); return; }
  if (mode === 'nk') { nkDownThisTurn = !nkAvailable; refreshStatus(true); }
  if (speakNow && wasVoice && !convo && lastAnswer) { unlockAudio(); speakText(lastAnswer); }   // replay in the new voice
}
document.querySelectorAll('.seg button').forEach(b => b.onclick = () => setMode(b.dataset.v));

let sysVoices = [];
function loadVoices() {
  sysVoices = window.speechSynthesis?.getVoices() || [];
  const sel = $('machineVoice'), keep = sel.value || store.get('nk.machineVoice', '');
  sel.innerHTML = '<option value="">Auto (Indian English / Hindi)</option>' +
    sysVoices.map(v => `<option value="${v.name}">${v.name} (${v.lang})</option>`).join('');
  sel.value = keep;
}
if ('speechSynthesis' in window) { loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; }
$('machineVoice').onchange = e => store.set('nk.machineVoice', e.target.value);

function pickMachineVoice(text) {
  const hindi = /[ऀ-ॿ]/.test(text);
  const chosen = sysVoices.find(v => v.name === $('machineVoice').value);
  if (chosen && !hindi) return chosen;
  const natural = v => /natural|online/i.test(v.name);            // Edge's neural voices sound far more human
  const male = v => /ravi|prabhat|hemant|madhur|male/i.test(v.name) && !/female/i.test(v.name);
  const by = re => { const c = sysVoices.filter(v => re.test(v.lang));
    return c.find(v => natural(v) && male(v)) || c.find(male) || c.find(natural) || c[0]; };
  return hindi ? (by(/^hi/i) || chosen) : (by(/^en[-_]IN/i) || chosen || by(/^en[-_](GB|US)/i));
}

/* =========================================================
   Speaking: NK voice (ElevenLabs) or machine voice, sentence queue
   ========================================================= */
let actx, analyser, freq, currentAudio = null;
function unlockAudio() {      // must run inside a click: browsers block sound until then
  try {
    if (!actx) {
      actx = new (window.AudioContext || window.webkitAudioContext)();
      analyser = actx.createAnalyser(); analyser.fftSize = 256; analyser.smoothingTimeConstant = .75;
      analyser.connect(actx.destination); freq = new Uint8Array(analyser.frequencyBinCount);
    }
    actx.resume?.();
  } catch { actx = null; }
}

const queue = []; let playing = false;

// At most 2 voice requests at a time from this browser (ElevenLabs plans cap parallel requests;
// when hosted, several server copies can run, so the limit has to live here too).
const TTS_MAX = 2; let ttsActive = 0; const ttsWaiters = [];
async function ttsSlot(fn) {
  while (ttsActive >= TTS_MAX) await new Promise(r => ttsWaiters.push(r));
  ttsActive++;
  try { return await fn(); } finally { ttsActive--; ttsWaiters.shift()?.(); }
}

function fetchNk(text, myTurn, tries = 3) {
  return ttsSlot(() => fetch('/api/tts', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ text, speed: pace() }) })
    .then(async r => {
      if (r.status === 401) { location.href = '/login'; throw new Error('locked'); }
      if (r.ok && (r.headers.get('content-type') || '').includes('audio')) return r.blob();
      let reason = 'HTTP ' + r.status; try { reason = (await r.json()).detail || reason; } catch {}
      throw new Error(reason);
    }))
    .catch(async e => {
      const busy = /busy|rate limit|HTTP 5\d\d/i.test(e.message);
      if (busy && tries > 0 && myTurn === turnId) {              // momentary overload: wait and try again
        await new Promise(r => setTimeout(r, 700 * (4 - tries)));
        return fetchNk(text, myTurn, tries - 1);
      }
      if (myTurn === turnId) {                                    // never switch voices mid-answer
        if (!busy) { nkAvailable = false; $('nkBad').hidden = false; }
        notice(busy ? 'ElevenLabs was busy, so part of this answer is shown as text only.'
                    : `NK voice unavailable (${e.message}). Part of this answer is shown as text only.`);
      }
      return null;
    });
}

function enqueue(text, blobPromise, filler = false, nk = false) {
  echoRef += ' ' + text;
  queue.push({ text, blob: blobPromise, turn: turnId, filler, nk });
  if (!playing) playNext();
}
function speak(sentence) {
  sentence = sentence.trim();
  if (!sentence || voiceMode === 'off') return;
  // One voice per answer: NK voice if it was available when the answer started, else the machine voice.
  const useNk = voiceMode === 'nk' && !nkDownThisTurn;
  enqueue(sentence, useNk ? fetchNk(sentence, turnId) : Promise.resolve(null), false, useNk);
}
function speakText(text) {             // NK voice: one smooth clip; machine voice: sentence by sentence
  if (voiceMode === 'nk' && !nkDownThisTurn && text.length < 450) return speak(text);
  (text.match(/[^.!?।]+[.!?।]*["')\]]?\s*/g) || [text]).forEach(speak);
}

async function playNext() {
  const item = queue.shift();
  if (!item) { playing = false; speaking = false; lastSpokeAt = Date.now(); updateState(); return; }
  playing = true;
  const blob = await item.blob;
  if (item.turn !== turnId) return playNext();
  if (item.nk && !blob) return playNext();          // NK clip failed: skip it rather than switch to the machine voice
  speaking = true; thinking = false; $('live').textContent = '';
  const via = blob ? 'NK Chaudhary voice' : 'Machine voice';
  updateState(via); if (!item.filler) markVia(via);
  try { blob ? await playBlob(blob) : await machineSpeak(item.text); } catch (e) { console.warn(e); }
  lastSpokeAt = Date.now();
  // machine voice: a short breath between sentences (the NK voice already has natural pauses)
  if (!blob && queue.length && item.turn === turnId && !item.filler) await new Promise(r => setTimeout(r, Math.round(300 / pace())));
  if (item.turn !== turnId) return;     // interrupted during the pause: the new turn runs its own queue
  playNext();
}

function playBlob(blob) {
  return new Promise(resolve => {
    const a = new Audio(URL.createObjectURL(blob)); currentAudio = a;
    try { if (actx) actx.createMediaElementSource(a).connect(analyser); } catch {}
    a.onended = a.onerror = a.onpause = () => { currentAudio = null; resolve(); };
    a.play().catch(() => { notice('Audio blocked by the browser: click the page once and try again.'); resolve(); });
  });
}

function machineSpeak(text) {
  return new Promise(resolve => {
    if (!('speechSynthesis' in window)) { notice('This browser has no built-in speech. Use Chrome or Edge.'); return resolve(); }
    const u = new SpeechSynthesisUtterance(text);
    const v = pickMachineVoice(text); if (v) { u.voice = v; u.lang = v.lang; } else u.lang = 'en-IN';
    u.rate = 0.97 * pace(); u.pitch = .92;
    u.onboundary = () => { synthPulse = 1; };
    const guard = setTimeout(resolve, 3000 + text.length * 90);   // some browsers never fire onend
    u.onend = () => { clearTimeout(guard); resolve(); };
    u.onerror = e => { clearTimeout(guard); if (e.error !== 'interrupted' && e.error !== 'canceled') notice('Machine voice error: ' + e.error); resolve(); };
    if (speechSynthesis.paused) speechSynthesis.resume();
    setTimeout(() => speechSynthesis.speak(u), 40);               // Chrome drops speak() right after cancel()
  });
}

/* Short "Hmm." while he thinks, like a person would. NK voice clips are fetched once and reused. */
const fillerBlobs = {};
function prefetchFillers() {
  if (voiceMode !== 'nk' || !nkAvailable) return;
  FILLERS.forEach(f => { if (!fillerBlobs[f]) fillerBlobs[f] = fetchNk(f, turnId).then(b => b || undefined); });
}
async function playFiller(myTurn) {
  if (myTurn !== turnId || speaking || playing || queue.length) return;
  const f = FILLERS[Math.floor(Math.random() * FILLERS.length)];
  if (voiceMode === 'machine' || (voiceMode === 'nk' && nkDownThisTurn)) { enqueue(f, Promise.resolve(null), true); return; }
  if (voiceMode === 'nk' && !nkDownThisTurn && fillerBlobs[f]) {
    const b = await fillerBlobs[f];
    if (b && myTurn === turnId && !speaking && !playing && !queue.length) enqueue(f, Promise.resolve(b), true);
  }
}

/* Stop talking and drop anything queued (barge-in, new question, mode switch) */
function interrupt() {
  turnId++; queue.length = 0;
  if (currentAudio) { currentAudio.pause(); currentAudio = null; }
  if ('speechSynthesis' in window) speechSynthesis.cancel();
  if (chatAbort) { chatAbort.abort(); chatAbort = null; }
  playing = false; speaking = false; thinking = false; updateState();
}

/* =========================================================
   Asking (typed, or spoken in a conversation)
   ========================================================= */
let chatAbort = null, viaEl = null;
function add(cls, text) {
  $('hint')?.remove();
  const d = document.createElement('div'); d.className = 'msg ' + cls;
  if (cls === 'nk') { d.innerHTML = '<span class="who">NK CHAUDHARY</span><span class="body"></span><span class="via"></span>'; d.querySelector('.body').textContent = text; }
  else d.textContent = text;
  $('inner').appendChild(d); $('log').scrollTop = $('log').scrollHeight; return d;
}
function markVia(v) { if (viaEl && !viaEl.textContent.includes(v)) viaEl.textContent = viaEl.textContent ? viaEl.textContent + ' + ' + v : 'Spoken in: ' + v; }
const SENTENCE_END = /([.!?।]+["')\]]?)\s+/;

async function ask(text, { spoken = false } = {}) {
  text = text.trim(); if (!text) return;
  lastAsked = text; loudRun = 0;
  interrupt(); unlockAudio();
  const myTurn = turnId; echoRef = '';
  if (voiceMode === 'nk') { nkDownThisTurn = !nkAvailable; if (!nkAvailable) refreshStatus(true); }
  add('me', text);
  const el = add('nk', ''), body = el.querySelector('.body'); viaEl = el.querySelector('.via');
  thinking = true; updateState();
  if (spoken && voiceMode !== 'off') setTimeout(() => playFiller(myTurn), 1100);
  chatAbort = new AbortController();
  let full = '', pending = '', first = true, chunk = '', spokenParts = 0;
  const say = (piece, force = false) => {          // first piece alone, then group sentences into ~200-char clips
    chunk += piece + ' ';
    if (force || spokenParts === 0 || chunk.length >= 200) { speak(chunk); chunk = ''; spokenParts++; }
  };
  try {
    const r = await fetch('/api/chat', { method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ message: text, history, mode: spoken ? 'voice' : 'text', conversation_id: conversationId }), signal: chatAbort.signal });
    if (r.status === 401) { location.href = '/login'; return; }
    const reader = r.body.getReader(), dec = new TextDecoder(); let buf = '';
    while (true) {
      const { value, done } = await reader.read(); if (done) break;
      if (myTurn !== turnId) { reader.cancel(); break; }
      buf += dec.decode(value, { stream: true });
      let i;
      while ((i = buf.indexOf('\n\n')) >= 0) {
        const line = buf.slice(0, i).replace(/^data: /, ''); buf = buf.slice(i + 2);
        if (!line.trim()) continue;
        const ev = JSON.parse(line);
        if (ev.conversation_id) conversationId = ev.conversation_id;
        if (ev.error) add('err', ev.error);
        if (ev.delta) {
          full += ev.delta; pending += ev.delta; body.textContent = full; $('log').scrollTop = $('log').scrollHeight;
          let m; while ((m = pending.match(SENTENCE_END))) {
            const cut = m.index + m[1].length; say(pending.slice(0, cut)); pending = pending.slice(cut).trimStart(); first = false;
          }
          // start talking sooner: speak a long first clause at its comma instead of waiting for the full stop
          if (first && pending.length > 70) { const c = pending.lastIndexOf(', '); if (c > 30) { say(pending.slice(0, c + 1)); pending = pending.slice(c + 2); first = false; } }
        }
      }
    }
    if (myTurn === turnId) say(pending, true);
  } catch (err) { if (err.name !== 'AbortError') add('err', err.message); }
  if (myTurn === turnId) { thinking = false; chatAbort = null; }
  if (full) { history.push({ role:'user', content:text }, { role:'assistant', content: full + (myTurn !== turnId ? ' …' : '') }); lastAnswer = full; }
  else if (myTurn !== turnId) el.remove();
  updateState();
}

$('f').onsubmit = e => { e.preventDefault(); const t = $('q').value; $('q').value = ''; ask(t); $('q').focus(); };
$('q').addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); $('f').requestSubmit(); } });
$('orb').onclick = () => { if (speaking || playing || thinking) interrupt(); else if (voiceMode !== 'off') toggleConvo(); };

/* =========================================================
   Conversation: intro -> listen -> (you pause) -> answer -> listen ...
   Two ears work together:
   - the mic LEVEL (with echo cancellation) tells when you start/stop talking and when you talk over him,
   - the browser's recogniser turns your words into text; if it misses an utterance, the recording
     of that utterance is sent to ElevenLabs speech-to-text instead, so nothing you say is lost.
   ========================================================= */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let convo = false, rec = null, recOn = false, recStarting = false, lastResultAt = 0;
let segStart = 0, lastLen = 0, lastFinal = true, carry = '', utter = '', lastHeardAt = 0, heardFinal = false;
let micStream = null, micAnalyser = null, micBuf = null, noiseFloor = 0.01, lastLoudAt = 0, endTimer = null;
let turnActive = false, turnStartAt = 0, voicedMs = 0, loudRun = 0, lastTick = 0, echoWin = [];
let recorder = null, recChunks = [], transcribing = false, lastAsked = '', bargedAt = 0;

const words = s => (s.toLowerCase().match(/[\p{L}\p{N}]+/gu) || []);
function isEcho(t, need = 0.6) {   // is the mic hearing his own voice from the speakers? (matching word pairs, in order)
  const w = words(t); if (w.length < 2) return true;
  const ref = words(echoRef), pairs = new Set();
  for (let i = 0; i < ref.length - 1; i++) pairs.add(ref[i] + ' ' + ref[i + 1]);
  let hit = 0; for (let i = 0; i < w.length - 1; i++) if (pairs.has(w[i] + ' ' + w[i + 1])) hit++;
  return hit / (w.length - 1) >= need;
}
const busy = () => speaking || playing || thinking;

// How easily your voice interrupts him / starts your turn. Low needs a clearly louder voice AND real words,
// so his own voice coming out of the laptop speakers can't interrupt him.
const SENS = {
  low:    { echoMul: 5, minThr: 0.06,  bargeMs: 450, needWords: true,  startMs: 260, startMin: 0.022 },
  medium: { echoMul: 4, minThr: 0.045, bargeMs: 380, needWords: false, startMs: 180, startMin: 0.016 },
  high:   { echoMul: 3, minThr: 0.03,  bargeMs: 280, needWords: false, startMs: 120, startMin: 0.012 },
};
const sens = () => SENS[$('sens').value] || SENS.low;

/* ---------- browser speech recogniser (kept alive, restarted when Chrome drops it) ---------- */
function startRec() {
  if (!convo || recOn || recStarting) return;
  recStarting = true;
  rec = new SR();
  rec.lang = $('listenLang').value; rec.continuous = true; rec.interimResults = true; rec.maxAlternatives = 1;
  segStart = 0; lastLen = 0; lastFinal = true;
  rec.onstart = () => { recOn = true; recStarting = false; lastResultAt = Date.now(); updateState(); };
  rec.onresult = e => {
    lastResultAt = Date.now(); lastLen = e.results.length; lastFinal = e.results[lastLen - 1]?.isFinal ?? true;
    let fin = '', interim = '', allFinal = true;
    for (let i = segStart; i < e.results.length; i++) {
      const r = e.results[i];
      if (r.isFinal) fin += r[0].transcript + ' '; else { interim += r[0].transcript + ' '; allFinal = false; }
    }
    const heard = (carry + ' ' + fin + interim).replace(/\s+/g, ' ').trim();
    if (!heard || transcribing) return;
    const recentlySpoke = Date.now() - lastSpokeAt < 1500;
    const justBarged = Date.now() - bargedAt < 3000;               // after you interrupt, only drop pure echo
    if ((busy() || recentlySpoke) && !carry && isEcho(heard, justBarged ? 0.95 : 0.6)) {    // his own voice through the speakers
      if (allFinal) segStart = e.results.length;
      return;
    }
    if (busy()) {
      if (words(heard).length < 2) return;                          // wait for a clear word or two
      if (sens().needWords && micAnalyser && Date.now() - lastLoudAt > 700) return;   // words but no loud voice: echo
      bargeIn();
      segStart = Math.min(segStart, e.resultIndex);                 // keep the words that interrupted him
      return rec.onresult(e);                                       // ...and treat them as the start of your turn
    }
    utter = heard; heardFinal = allFinal; lastHeardAt = Date.now();
    if (!turnActive) beginTurn();
    $('live').textContent = '“' + heard + '”';
    updateState();
  };
  rec.onerror = e => {
    recStarting = false;
    if (e.error === 'no-speech' || e.error === 'aborted') return;
    if (e.error === 'not-allowed' || e.error === 'service-not-allowed') { notice('Microphone permission was blocked. Allow the mic for this site and press Start again.'); stopConvo(); }
    else if (e.error === 'network') notice('The browser recogniser lost its connection; using the backup transcriber.');
    else if (e.error !== 'audio-capture') notice('Mic: ' + e.error);
  };
  rec.onend = () => {                       // Chrome ends sessions now and then: keep what was said, restart
    recOn = false; recStarting = false; if (utter) carry = utter; updateState();
    if (convo) setTimeout(startRec, 120);
  };
  try { rec.start(); } catch { recStarting = false; setTimeout(startRec, 400); }
}
function restartRec() {                     // recogniser seems stuck: give it a fresh session
  if (recOn) { try { rec.abort(); } catch {} }        // onend restarts it
  else if (!recStarting) setTimeout(startRec, 150);
}

/* ---------- mic level (voice activity) with echo cancellation, + a recorder for the backup transcriber ---------- */
async function startMicMeter() {
  try {
    micStream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true } });
    const src = actx.createMediaStreamSource(micStream);
    micAnalyser = actx.createAnalyser(); micAnalyser.fftSize = 1024; micBuf = new Float32Array(micAnalyser.fftSize);
    src.connect(micAnalyser);                 // not connected to the speakers
  } catch { micAnalyser = null; notice('Could not open the microphone level meter; relying on the browser recogniser only.'); }
}
function micRms() {
  if (!micAnalyser) return 0;
  micAnalyser.getFloatTimeDomainData(micBuf);
  let s = 0; for (const x of micBuf) s += x * x; return Math.sqrt(s / micBuf.length);
}
const REC_MIME = ['audio/webm;codecs=opus', 'audio/webm', 'audio/ogg;codecs=opus', 'audio/mp4']
  .find(m => window.MediaRecorder && MediaRecorder.isTypeSupported?.(m)) || '';

/* ---------- your turn: begin, barge-in, end ---------- */
function beginTurn() {
  if (turnActive) return;
  turnActive = true; turnStartAt = Date.now(); voicedMs = 0;
  if (micStream && window.MediaRecorder) {
    try {
      recChunks = [];
      recorder = new MediaRecorder(micStream, REC_MIME ? { mimeType: REC_MIME } : undefined);
      recorder.ondataavailable = e => { if (e.data.size) recChunks.push(e.data); };
      recorder.start();
    } catch { recorder = null; }
  }
  updateState();
}
function stopRecorder() {
  return new Promise(res => {
    const r = recorder; recorder = null;
    if (!r || r.state === 'inactive') return res(null);
    r.onstop = () => res(new Blob(recChunks, { type: r.mimeType || 'audio/webm' }));
    try { r.stop(); } catch { res(null); }
  });
}

function bargeIn() {                        // you started talking over him: he stops at once and listens
  const wasOnlyThinking = thinking && !speaking && !playing;
  interrupt(); notice(''); bargedAt = Date.now();
  segStart = lastFinal ? lastLen : Math.max(0, lastLen - 1);   // keep the words being spoken right now
  utter = '';
  carry = wasOnlyThinking ? lastAsked : '';                    // he hadn't answered yet: your new words add to the question
  lastHeardAt = Date.now();
  beginTurn();
}

async function endTurn() {
  turnActive = false;
  const text = utter.trim(), voiced = voicedMs;
  utter = ''; carry = ''; heardFinal = false; segStart = lastLen; $('live').textContent = '';
  const blob = await stopRecorder();
  if (words(text).length) { ask(text, { spoken: true }); return; }
  if (!blob || voiced < 350) { updateState(); return; }               // just a noise, not speech
  // The browser recogniser caught nothing even though you spoke: use the backup transcriber.
  transcribing = true; updateState();
  try {
    const r = await fetch('/api/stt?lang=' + encodeURIComponent($('listenLang').value),
      { method:'POST', headers:{ 'Content-Type': blob.type || 'audio/webm' }, body: blob });
    const j = await r.json();
    transcribing = false;
    if (j.text && words(j.text).length) ask(j.text, { spoken: true });
    else if (j.detail) notice('Backup transcription failed: ' + j.detail);
    else if (voiced > 1200) notice("Sorry, I didn't catch that. Please say it again.");
  } catch { transcribing = false; if (voiced > 1200) notice("Sorry, I didn't catch that. Please say it again."); }
  updateState();
  restartRec();                                                        // it missed you once: fresh session
}

/* ---------- the listening loop, every 60 ms ---------- */
function endpointTick() {
  if (!convo) return;
  const now = Date.now(), dt = lastTick ? Math.min(200, now - lastTick) : 60; lastTick = now;
  const rms = micRms();
  const hisVoice = speaking || playing;                     // his voice may leak from the speakers into the mic
  if (hisVoice) { echoWin.push(rms); if (echoWin.length > 25) echoWin.shift(); }
  else { echoWin.length = 0; noiseFloor = rms < noiseFloor ? noiseFloor * .8 + rms * .2 : noiseFloor * .995 + rms * .005; }
  const S = sens();
  let thr = Math.max(noiseFloor * 2.8, S.startMin);
  if (hisVoice) {                                           // you must be clearly louder than his echo
    const sorted = [...echoWin].sort((a, b) => a - b), med = sorted[sorted.length >> 1] || 0;
    thr = Math.max(med * S.echoMul, noiseFloor * 4, S.minThr);
  }
  const loud = !!micAnalyser && rms > thr;
  // continuous voice time; a short dip (< 150 ms, between syllables) doesn't reset it
  if (loud) { loudRun += dt; lastLoudAt = now; if (turnActive) voicedMs += dt; }
  else if (now - lastLoudAt > 150) loudRun = 0;
  userLevel = !hisVoice && micAnalyser ? Math.min(1, rms * 12) : 0;

  // you talk over him -> he stops (doesn't wait for the recogniser)
  if (hisVoice && micAnalyser && !S.needWords && echoWin.length >= 6 && loudRun >= S.bargeMs) { bargeIn(); return; }
  // you start talking -> your turn begins (recording starts too)
  if (!busy() && !transcribing && !turnActive && loudRun >= S.startMs && now - lastSpokeAt > 600) beginTurn();

  if (!turnActive || busy() || transcribing) return;
  const pause = +$('pause').value;
  const quiet = now - Math.max(lastHeardAt, micAnalyser ? lastLoudAt : 0);
  const needed = pause + (utter && !heardFinal ? 200 : 0) + (!utter ? 300 : 0);
  if (quiet >= needed || now - turnStartAt > 30000) { endTurn(); return; }
  // lots of voice but the recogniser has said nothing for 4 s: restart it (the backup still has this turn recorded)
  if (!utter && voicedMs > 1500 && now - Math.max(lastResultAt, turnStartAt) > 4000) { lastResultAt = now; restartRec(); }
}

async function startConvo() {
  if (!SR && !window.MediaRecorder) { notice('Voice conversation needs Chrome or Microsoft Edge.'); return; }
  unlockAudio();
  convo = true; $('talk').classList.add('on'); $('talkLabel').textContent = 'End conversation';
  conversationId = null; history = [];     // a fresh, separately saved conversation
  interrupt(); echoRef = ''; utter = ''; carry = ''; turnActive = false; lastTick = 0; loudRun = 0;
  if (voiceMode === 'nk') { nkDownThisTurn = !nkAvailable; prefetchFillers(); }
  viaEl = null;
  await startMicMeter();
  if (SR) startRec(); else { recOn = true; updateState(); }      // no browser recogniser: backup transcriber only
  endTimer = setInterval(endpointTick, 60);
  speakText(INTRO);
}
function stopConvo() {
  convo = false; $('talk').classList.remove('on'); $('talkLabel').textContent = 'Start conversation';
  conversationId = null;
  clearInterval(endTimer); utter = ''; carry = ''; turnActive = false; $('live').textContent = '';
  stopRecorder();
  try { rec && rec.abort(); } catch {}
  micStream?.getTracks().forEach(t => t.stop()); micStream = null; micAnalyser = null;
  recOn = false; recStarting = false; interrupt();
}
function toggleConvo() { convo ? stopConvo() : startConvo(); }
$('talk').onclick = toggleConvo;
$('listenLang').value = store.get('nk.listenLang', 'en-IN');
$('listenLang').onchange = e => { store.set('nk.listenLang', e.target.value); if (rec) try { rec.abort(); } catch {} };
$('pause').value = store.get('nk.pause', '950');
$('sens').value = store.get('nk.sens', 'low');
$('sens').onchange = e => store.set('nk.sens', e.target.value);
$('pause').onchange = e => store.set('nk.pause', e.target.value);
function pace() { return +$('pace').value || 0.88; }
$('pace').value = store.get('nk.pace', '0.88');
$('pace').onchange = e => { store.set('nk.pace', e.target.value); for (const k in fillerBlobs) delete fillerBlobs[k]; if (convo) prefetchFillers(); };

/* =========================================================
   Status line
   ========================================================= */
function updateState(via) {
  const st = $('state'); st.className = 'state';
  let t = voiceMode === 'off' ? 'Text mode' : 'Ready';
  if (speaking) { st.classList.add('speaking'); t = 'Speaking' + (via ? ' · ' + via : '') + (convo ? ' · talk to interrupt' : ''); }
  else if (thinking) { st.classList.add('thinking'); t = 'Thinking…'; }
  else if (transcribing) { st.classList.add('thinking'); t = 'Catching what you said…'; }
  else if (convo && recOn) { st.classList.add('listening'); t = turnActive ? 'Listening… he replies when you pause' : 'Listening… go ahead'; }
  else if (convo) { t = 'Starting microphone…'; }
  $('stateText').textContent = t;
}

/* =========================================================
   Waveform: his voice (blue) or your voice (pink) while you talk
   ========================================================= */
const cv = $('wave'), g = cv.getContext('2d');
function resize() { const r = cv.getBoundingClientRect(), d = devicePixelRatio || 1; cv.width = r.width * d; cv.height = r.height * d; g.setTransform(d,0,0,d,0,0); }
addEventListener('resize', resize); resize();
let t = 0;
function draw() {
  t += 1;
  const W = cv.clientWidth, H = cv.clientHeight, cx = W / 2, cy = H / 2;
  g.clearRect(0, 0, W, H);
  const live = speaking && currentAudio && analyser;
  const you = convo && !speaking && userLevel > .05;
  let target = 0;
  if (live) { analyser.getByteFrequencyData(freq); target = freq.slice(2, 60).reduce((a,b)=>a+b,0) / (58*255) * 1.8; }
  else if (speaking) { synthPulse *= .9; target = .35 + .35 * synthPulse + .15 * Math.sin(t * .23); }
  else if (you) { target = userLevel * .9; }
  else if (convo && recOn) { target = .06 + .04 * Math.sin(t * .08); }
  level += (Math.min(target, 1) - level) * .22;
  const step = 7, bw = 3, half = Math.ceil(cx / step);
  for (let i = 0; i < half; i++) {
    const dist = i / half;
    const amp = live ? freq[Math.min(freq.length - 1, 2 + Math.floor(dist * 70))] / 255
                     : .5 + .5 * Math.sin(i * .55 + t * .05) * Math.sin(i * .17 - t * .03);
    const idle = .16 + .2 * amp, fall = Math.pow(1 - dist, 1.4);
    const h = Math.max(4, H * .78 * fall * (idle + level * (.35 + .65 * amp)));
    const alpha = .25 + .75 * fall;
    for (const sgn of [-1, 1]) {
      const x = cx + sgn * i * step - bw / 2;
      const pinkish = you ? (i % 3 !== 0) : ((i % 9 === 4) || (i % 13 === 7));
      const grad = g.createLinearGradient(0, cy - h / 2, 0, cy + h / 2);
      grad.addColorStop(0, pinkish ? 'rgba(255,94,168,0)' : 'rgba(63,198,255,0)');
      grad.addColorStop(.25, pinkish ? `rgba(255,94,168,${alpha})` : `rgba(63,198,255,${alpha})`);
      grad.addColorStop(.5, `rgba(255,255,255,${alpha * .95})`);
      grad.addColorStop(.75, pinkish ? `rgba(255,94,168,${alpha})` : `rgba(43,123,255,${alpha})`);
      grad.addColorStop(1, 'rgba(43,123,255,0)');
      g.fillStyle = grad; g.shadowColor = pinkish ? '#ff5ea8' : '#3fc6ff'; g.shadowBlur = 8 * fall;
      g.fillRect(x, cy - h / 2, bw, h);
    }
  }
  g.shadowBlur = 0;
  $('orb').style.transform = `translate(-50%,-50%) scale(${1 + level * .045})`;
  requestAnimationFrame(draw);
}
requestAnimationFrame(draw);

/* =========================================================
   Boot
   ========================================================= */
if (!SR) $('talk').title = 'Needs Chrome or Edge';
setMode(store.get('nk.voiceMode', 'nk'), { speakNow: false });
refreshStatus();
updateState();
</script>
